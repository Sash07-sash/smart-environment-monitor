<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — Aether</title>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
<link rel="stylesheet" href="shared.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌐</text></svg>">
</head>
<body>

<div class="auth-wrap">
  <!-- LOGIN FORM -->
  <div class="auth-box auth-toggle" id="loginForm">
    <a class="auth-back" href="landing.html">← Back to Overview</a>
    <div class="auth-head">Sign In</div>
    <div class="auth-desc">Access your real-time IoT environment dashboard</div>
    <div class="auth-error" id="loginErr"></div>
    <form onsubmit="handleLogin(event)">
      <div class="field">
        <label>Email Address</label>
        <input type="email" id="loginEmail" placeholder="you@aether.io" required>
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="loginPass" placeholder="••••••••" required>
      </div>
      <button type="submit" class="auth-submit" id="loginBtn">Sign In</button>
    </form>
    <button class="auth-google" onclick="handleGoogleSignIn()" id="googleBtn">
      <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84c-.21 1.13-.85 2.08-1.81 2.72v2.26h2.92c1.71-1.57 2.69-3.88 2.69-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.81.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.96v2.33C2.44 15.98 5.48 18 9 18z"/><path fill="#FBBC05" d="M3.97 10.72c-.18-.54-.28-1.12-.28-1.72s.1-1.18.28-1.72V4.95H.96C.35 6.17 0 7.55 0 9s.35 2.83.96 4.05l3.01-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0 5.48 0 2.44 2.02.96 4.95l3.01 2.33C4.68 5.16 6.66 3.58 9 3.58z"/></svg>
      Continue with Google
    </button>
    <div class="auth-switch">Don't have an account? <button onclick="showForm('signup')">Create one</button></div>
  </div>

  <!-- SIGNUP FORM -->
  <div class="auth-box auth-toggle" id="signupForm">
    <a class="auth-back" href="landing.html">← Back to Overview</a>
    <div class="auth-head">Create Account</div>
    <div class="auth-desc">Provision your new environment monitoring dashboard</div>
    <div class="auth-error" id="signupErr"></div>
    <form onsubmit="handleSignup(event)">
      <div class="field">
        <label>Email Address</label>
        <input type="email" id="signupEmail" placeholder="you@aether.io" required>
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="signupPass" placeholder="min. 6 characters" required minlength="6">
      </div>
      <div class="field">
        <label>Confirm Password</label>
        <input type="password" id="signupConfirm" placeholder="••••••••" required minlength="6">
      </div>
      <button type="submit" class="auth-submit" id="signupBtn">Create Account</button>
    </form>
    <div class="auth-switch">Already registered? <button onclick="showForm('login')">Sign In</button></div>
  </div>
</div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyDfTBoWyVvxItwMqBDAFZdOi_kvPa7agBY",
    authDomain: "smart-environment-monito-3c43f.firebaseapp.com",
    projectId: "smart-environment-monito-3c43f",
    storageBucket: "smart-environment-monito-3c43f.firebasestorage.app",
    messagingSenderId: "301278903288",
    appId: "1:301278903288:web:7fec37baef0d22ba2d740d"
  };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();

  function showForm(name){
    document.getElementById('loginForm').classList.toggle('active', name === 'login');
    document.getElementById('signupForm').classList.toggle('active', name === 'signup');
  }

  // Read ?mode=signup from the landing page link
  const params = new URLSearchParams(window.location.search);
  showForm(params.get('mode') === 'signup' ? 'signup' : 'login');

  async function handleLogin(e){
    e.preventDefault();
    const email = document.getElementById('loginEmail').value;
    const pass = document.getElementById('loginPass').value;
    const btn = document.getElementById('loginBtn');
    const err = document.getElementById('loginErr');
    btn.disabled = true; btn.textContent = 'Signing in…'; err.classList.remove('active');
    try{
      await auth.signInWithEmailAndPassword(email, pass);
      window.location.href = 'dashboard.html';
    }catch(error){
      err.textContent = error.message; err.classList.add('active');
      btn.disabled = false; btn.textContent = 'Sign In';
    }
  }

  async function handleSignup(e){
    e.preventDefault();
    const email = document.getElementById('signupEmail').value;
    const pass = document.getElementById('signupPass').value;
    const confirm = document.getElementById('signupConfirm').value;
    const btn = document.getElementById('signupBtn');
    const err = document.getElementById('signupErr');
    if(pass !== confirm){ err.textContent = 'Passwords do not match'; err.classList.add('active'); return; }
    btn.disabled = true; btn.textContent = 'Creating account…'; err.classList.remove('active');
    try{
      await auth.createUserWithEmailAndPassword(email, pass);
      window.location.href = 'dashboard.html';
    }catch(error){
      err.textContent = error.message; err.classList.add('active');
      btn.disabled = false; btn.textContent = 'Create Account';
    }
  }

  async function handleGoogleSignIn(){
    const btn = document.getElementById('googleBtn');
    const err = document.getElementById('loginErr');
    btn.disabled = true;
    err.classList.remove('active');
    try{
      const provider = new firebase.auth.GoogleAuthProvider();
      await auth.signInWithPopup(provider);
      window.location.href = 'dashboard.html';
    }catch(error){
      err.textContent = error.message;
      err.classList.add('active');
      btn.disabled = false;
    }
  }

  // If already signed in, skip straight to dashboard
  auth.onAuthStateChanged(user => {
    if(user) window.location.href = 'dashboard.html';
  });
</script>
</body>
</html>
